# ==============================================================================
# sysmon.conf - Configuration for Production System Monitor (sysmon.sh)
# Part of the 1000-Days AI Cloud Infrastructure Journey (Day 226 / Linux Day 30)
# ==============================================================================

# --- Resource Thresholds (Percentages 0-100) ---
# CPU Utilization Thresholds
CPU_WARN=70
CPU_CRIT=90

# Memory (RAM) Usage Thresholds (Calculated as: (Total - Available) / Total)
MEM_WARN=80
MEM_CRIT=95

# Disk Filesystem Capacity Thresholds
DISK_WARN=80
DISK_CRIT=90

# --- Process & Log Limits ---
# Number of top resource-consuming / longest-running processes to display
TOP_PROCESS_COUNT=3

# Number of recent error-priority systemd journal entries to inspect
JOURNAL_LOG_LINES=5

# --- Output & Logging Preferences ---
# Default output mode: "text" or "json"
DEFAULT_OUTPUT_FORMAT="text"

# Log destination when running via systemd service or daemon
LOG_FILE="/var/log/sysmon.log"

# Enable ANSI color output in terminal (true/false)
ENABLE_COLORS=true
